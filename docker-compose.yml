services:
  wb2api:
    build:
      context: .
      # 注入 commit：Docker 构建上下文排除了 .git/，镜像里读不到 vcs 信息，
      # 于是版本串会缺 commit。用 GIT_COMMIT=$(git rev-parse --short HEAD) docker compose build 传入。
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        # 可选：国内网络替换 apk 源（dl-cdn.alpinelinux.org 常拉不动）。
        # 在 .env 里写 APK_MIRROR=mirrors.aliyun.com 即可——别改 Dockerfile，
        # 改了以后每次上游更新都会冲突，这个参数就是为了消灭那种冲突。
        APK_MIRROR: ${APK_MIRROR:-}
    container_name: workbuddy2api
    restart: unless-stopped
    # 容器默认以 app 用户（uid 10001）运行。宿主机挂载目录属主不同会导致
    # 「写入 auths/*.json.tmp 失败 permission denied」，三种解法任选：
    #   1) 非 root · 让容器以你自己的 uid 运行（挂载目录本来就是你建的）：
    #      PUID=$(id -u) PGID=$(id -g) docker compose up -d
    #      或写进 .env 文件：PUID=1000 / PGID=1000
    #   2) sudo chown -R 10001:10001 ./auths ./data ./config.json
    #   3) user: "0:0" 以 root 运行（省事但容器逃逸面更大，自担）
    user: "${PUID:-10001}:${PGID:-10001}"
    environment:
      - TZ=Asia/Shanghai
    # 日志上限：默认 json-file 驱动**不设上限**，长期跑会把宿主机磁盘吃满
    # （这类事故很常见，且发生得很慢、很难联想到是容器日志）。20m×5 = 100m 上限。
    # 注意：容器重建后日志即丢失 —— 升级前先 `docker compose logs > /var/log/...`。
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    ports:
      # BIND_ADDR 默认 0.0.0.0（对上游行为零改动）。放 127.0.0.1 即可只走本机反代，
      # 不直接对外暴露面板——写进 .env，别改这一行（改了每次更新都冲突）。
      - "${BIND_ADDR:-0.0.0.0}:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 注意：宿主机必须先有 config.json（cp config.example.json config.json）。
      # 缺失时 Docker 会把挂载点创建成目录 → 容器启动失败（程序会自动生成配置，
      # 但前提是它能以文件形式写入 —— 挂载目录会挡住这条路径）。
      # 不挂 :ro：面板「配置」页需要写回此文件（保存后热生效）。
      - ./config.json:/app/config.json
